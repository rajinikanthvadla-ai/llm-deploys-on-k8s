# kind cluster with host port 18080 -> NodePort 30080 (llama.cpp)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: llm-lab
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 18080
        protocol: TCP
      - containerPort: 30081
        hostPort: 18081
        protocol: TCP
