apiVersion: apps/v1
kind: Deployment
metadata:
  name: llamacpp
  namespace: llm
  labels:
    app: llamacpp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llamacpp
  template:
    metadata:
      labels:
        app: llamacpp
    spec:
      initContainers:
        - name: fetch-model
          image: curlimages/curl:8.7.1
          envFrom:
            - configMapRef:
                name: llamacpp-config
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /models
              if [ ! -f "/models/${MODEL_FILE}" ]; then
                echo "Downloading base model..."
                curl -fL --retry 3 --retry-delay 5 -o "/models/${MODEL_FILE}" "${MODEL_URL}"
              else
                echo "Base model already present."
              fi
              if [ -n "${LORA_URL}" ] && [ ! -f "/models/${LORA_FILE}" ]; then
                echo "Downloading LoRA adapter..."
                curl -fL --retry 3 --retry-delay 5 -o "/models/${LORA_FILE}" "${LORA_URL}"
              fi
          volumeMounts:
            - name: model-cache
              mountPath: /models
      containers:
        - name: server
          image: ghcr.io/ggml-org/llama.cpp:server
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: llamacpp-config
          command:
            - sh
            - -c
            - |
              set -e
              ARGS="--host 0.0.0.0 --port ${SERVER_PORT} -m /models/${MODEL_FILE} -c ${CONTEXT_SIZE} -ngl ${N_GPU_LAYERS}"
              if [ -n "${LORA_URL}" ] && [ -f "/models/${LORA_FILE}" ]; then
                ARGS="${ARGS} --lora /models/${LORA_FILE}"
              fi
              echo "Starting: /app/llama-server ${ARGS}"
              exec /app/llama-server ${ARGS}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "3Gi"
          volumeMounts:
            - name: model-cache
              mountPath: /models
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
